apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kshield-apply
rules:
  - apiGroups: [kyverno.io]
    resources: [policies]
    verbs: [create, patch]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies, tracingpoliciesnamespaced]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kshield-apply-patches
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [patch]
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [patch]
  - apiGroups: [ray.io]
    resources: [rayclusters, rayservices, rayjobs]
    verbs: [patch]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices, servingruntimes]
    verbs: [patch]
