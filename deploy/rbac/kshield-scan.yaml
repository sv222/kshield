apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kshield-scan
rules:
  - apiGroups: [""]
    resources: [pods, services, serviceaccounts, configmaps, namespaces]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list]
  - apiGroups: [ray.io]
    resources: [rayclusters, rayservices, rayjobs]
    verbs: [get, list]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices, servingruntimes, clusterservingruntimes]
    verbs: [get, list]
  - apiGroups: [serving.knative.dev]
    resources: [services, configurations, revisions]
    verbs: [get, list]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies, ciliumclusterwidenetworkpolicies, tracingpolicies, tracingpoliciesnamespaced]
    verbs: [get, list]
  - apiGroups: [kyverno.io]
    resources: [policies, clusterpolicies]
    verbs: [get, list]
