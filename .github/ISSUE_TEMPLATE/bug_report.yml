name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security problems here. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: kshield version
      description: Output of `kshield version`
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: The smallest manifest that shows the problem. Remove secrets.
      render: yaml
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Output and exit code
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, and for a cluster scan the Kubernetes version and CNI
