name: Feature request
description: Suggest a new check, format or option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What risk or task is not covered today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should kshield do? For a new check, give a bad and a good manifest.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Docs, CVEs or regulation text that support it
