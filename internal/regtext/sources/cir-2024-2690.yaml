id: "cir-2024-2690"
short: "CIR (EU) 2024/2690"
title: "Commission Implementing Regulation (EU) 2024/2690"
celex: "32024R2690"
url: "https://eur-lex.europa.eu/eli/reg_impl/2024/2690/oj"
fetched: "2026-11-21"
fullTextFile: "cir-2024-2690.txt"
excerpts:
  - id: "cir-annex-3-2-1"
    article: "Annex"
    paragraph: "3.2.1"
    text: "The relevant entities shall lay down procedures and use tools to monitor and log activities on their network and information systems to detect events that could be considered as incidents and respond accordingly to mitigate the impact."
  - id: "cir-annex-6-3-2-a"
    article: "Annex"
    paragraph: "6.3.2"
    point: "a"
    text: "lay down and ensure security in configurations for their hardware, software, services and networks;"
  - id: "cir-annex-6-3-2-b"
    article: "Annex"
    paragraph: "6.3.2"
    point: "b"
    text: "lay down and implement processes and tools to enforce the laid down secure configurations for hardware, software, services and networks, for newly installed systems as well as for systems in operation over their lifetime."
  - id: "cir-annex-6-6-1-c"
    article: "Annex"
    paragraph: "6.6.1"
    point: "c"
    text: "security patches come from trusted sources and are checked for integrity;"
  - id: "cir-annex-6-7-2-c"
    article: "Annex"
    paragraph: "6.7.2"
    point: "c"
    text: "configure controls to prevent accesses and network communication not required for the operation of the relevant entities;"
  - id: "cir-annex-6-8-1"
    article: "Annex"
    paragraph: "6.8.1"
    text: "The relevant entities shall segment systems into networks or zones in accordance with the results of the risk assessment referred to in point 2.1. They shall segment their systems and networks from third parties’ systems and networks."
  - id: "cir-annex-6-8-2-e"
    article: "Annex"
    paragraph: "6.8.2"
    point: "e"
    text: "restrict access and communications between and within zones to those necessary for the operation of the relevant entities or for safety;"
  - id: "cir-annex-6-9-1"
    article: "Annex"
    paragraph: "6.9.1"
    text: "The relevant entities shall protect their network and information systems against malicious and unauthorised software."
  - id: "cir-annex-9-2-a"
    article: "Annex"
    paragraph: "9.2"
    point: "a"
    text: "in accordance with the relevant entities’ classification of assets, the type, strength and quality of the cryptographic measures required to protect the relevant entities’ assets, including data at rest and data in transit;"
  - id: "cir-annex-11-1-2-c"
    article: "Annex"
    paragraph: "11.1.2"
    point: "c"
    text: "ensure that access is only granted to users that have been adequately authenticated."
  - id: "cir-annex-11-2-2-a"
    article: "Annex"
    paragraph: "11.2.2"
    point: "a"
    text: "assign and revoke access rights based on the principles of need-to-know, least privilege and separation of duties;"
