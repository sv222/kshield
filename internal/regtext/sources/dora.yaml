id: "dora"
short: "DORA"
title: "Regulation (EU) 2022/2554 (DORA)"
celex: "32022R2554"
url: "https://eur-lex.europa.eu/eli/reg/2022/2554/oj"
fetched: "2026-10-17"
fullTextFile: "dora.txt"
excerpts:
  - id: "dora-art9-2"
    article: "9"
    paragraph: "2"
    text: "Financial entities shall design, procure and implement ICT security policies, procedures, protocols and tools that aim to ensure the resilience, continuity and availability of ICT systems, in particular for those supporting critical or important functions, and to maintain high standards of availability, authenticity, integrity and confidentiality of data, whether at rest, in use or in transit."
  - id: "dora-art9-3-a"
    article: "9"
    paragraph: "3"
    point: "a"
    text: "ensure the security of the means of transfer of data;"
  - id: "dora-art9-3-b"
    article: "9"
    paragraph: "3"
    point: "b"
    text: "minimise the risk of corruption or loss of data, unauthorised access and technical flaws that may hinder business activity;"
  - id: "dora-art9-3-c"
    article: "9"
    paragraph: "3"
    point: "c"
    text: "prevent the lack of availability, the impairment of the authenticity and integrity, the breaches of confidentiality and the loss of data;"
  - id: "dora-art9-4-b"
    article: "9"
    paragraph: "4"
    point: "b"
    text: "following a risk-based approach, establish a sound network and infrastructure management structure using appropriate techniques, methods and protocols that may include implementing automated mechanisms to isolate affected information assets in the event of cyber-attacks;"
  - id: "dora-art9-4-c"
    article: "9"
    paragraph: "4"
    point: "c"
    text: "implement policies that limit the physical or logical access to information assets and ICT assets to what is required for legitimate and approved functions and activities only, and establish to that end a set of policies, procedures and controls that address access rights and ensure a sound administration thereof;"
  - id: "dora-art9-4-d"
    article: "9"
    paragraph: "4"
    point: "d"
    text: "implement policies and protocols for strong authentication mechanisms, based on relevant standards and dedicated control systems, and protection measures of cryptographic keys whereby data is encrypted based on results of approved data classification and ICT risk assessment processes;"
  - id: "dora-art9-4-e"
    article: "9"
    paragraph: "4"
    point: "e"
    text: "implement documented policies, procedures and controls for ICT change management, including changes to software, hardware, firmware components, systems or security parameters, that are based on a risk assessment approach and are an integral part of the financial entity’s overall change management process, in order to ensure that all changes to ICT systems are recorded, tested, assessed, approved, implemented and verified in a controlled manner;"
  - id: "dora-art9-4-f"
    article: "9"
    paragraph: "4"
    point: "f"
    text: "have appropriate and comprehensive documented policies for patches and updates."
  - id: "dora-art10-1"
    article: "10"
    paragraph: "1"
    text: "Financial entities shall have in place mechanisms to promptly detect anomalous activities, in accordance with Article 17, including ICT network performance issues and ICT-related incidents, and to identify potential material single points of failure.\n\nAll detection mechanisms referred to in the first subparagraph shall be regularly tested in accordance with Article 25."
