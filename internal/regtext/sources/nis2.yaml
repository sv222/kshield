id: "nis2"
short: "NIS2"
title: "Directive (EU) 2022/2555 (NIS2)"
celex: "32022L2555"
url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
fetched: "2026-11-21"
fullTextFile: "nis2.txt"
excerpts:
  - id: "nis2-art21-1"
    article: "21"
    paragraph: "1"
    text: "Member States shall ensure that essential and important entities take appropriate and proportionate technical, operational and organisational measures to manage the risks posed to the security of network and information systems which those entities use for their operations or for the provision of their services, and to prevent or minimise the impact of incidents on recipients of their services and on other services."
  - id: "nis2-art21-2-a"
    article: "21"
    paragraph: "2"
    point: "a"
    text: "policies on risk analysis and information system security;"
  - id: "nis2-art21-2-b"
    article: "21"
    paragraph: "2"
    point: "b"
    text: "incident handling;"
  - id: "nis2-art21-2-c"
    article: "21"
    paragraph: "2"
    point: "c"
    text: "business continuity, such as backup management and disaster recovery, and crisis management;"
  - id: "nis2-art21-2-d"
    article: "21"
    paragraph: "2"
    point: "d"
    text: "supply chain security, including security-related aspects concerning the relationships between each entity and its direct suppliers or service providers;"
  - id: "nis2-art21-2-e"
    article: "21"
    paragraph: "2"
    point: "e"
    text: "security in network and information systems acquisition, development and maintenance, including vulnerability handling and disclosure;"
  - id: "nis2-art21-2-f"
    article: "21"
    paragraph: "2"
    point: "f"
    text: "policies and procedures to assess the effectiveness of cybersecurity risk-management measures;"
  - id: "nis2-art21-2-g"
    article: "21"
    paragraph: "2"
    point: "g"
    text: "basic cyber hygiene practices and cybersecurity training;"
  - id: "nis2-art21-2-h"
    article: "21"
    paragraph: "2"
    point: "h"
    text: "policies and procedures regarding the use of cryptography and, where appropriate, encryption;"
  - id: "nis2-art21-2-i"
    article: "21"
    paragraph: "2"
    point: "i"
    text: "human resources security, access control policies and asset management;"
  - id: "nis2-art21-2-j"
    article: "21"
    paragraph: "2"
    point: "j"
    text: "the use of multi-factor authentication or continuous authentication solutions, secured voice, video and text communications and secured emergency communication systems within the entity, where appropriate."
