apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: ai
spec:
  serviceName: qdrant
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.9.0
