apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: canary
  namespace: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: canary
  strategy:
    canary:
      steps:
        - setWeight: 20
  template:
    metadata:
      labels:
        app: canary
    spec:
      containers:
        - name: main
          image: vllm/vllm-openai:v0.6.0
