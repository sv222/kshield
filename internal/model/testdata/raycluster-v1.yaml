apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: rc
  namespace: ai
spec:
  rayVersion: "2.9.0"
  headGroupSpec:
    rayStartParams:
      dashboard-host: 0.0.0.0
    labels:
      ray.io/group: spoofed-group
      role: head-extra
    template:
      metadata:
        labels:
          app: ray
          ray.io/cluster: spoofed
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.9.0
  workerGroupSpecs:
    - groupName: cpu
      replicas: 1
      minReplicas: 1
      maxReplicas: 2
      rayStartParams: {}
      template:
        metadata:
          labels:
            app: ray
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray:2.9.0
    - groupName: gpu
      replicas: 1
      minReplicas: 0
      maxReplicas: 4
      rayStartParams: {}
      template:
        metadata:
          labels:
            app: ray
            ray.io/node-type: spoofed
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray:2.9.0-gpu
