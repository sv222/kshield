apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai
  uid: 4a010000-0011-4000-8000-000000000011
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "facebook/opt-125m"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tetragon
  namespace: kube-system
  uid: 4a010000-0012-4000-8000-000000000012
  labels:
    app.kubernetes.io/name: tetragon
    app.kubernetes.io/instance: tetragon
    app.kubernetes.io/part-of: tetragon
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tetragon
      app.kubernetes.io/instance: tetragon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tetragon
        app.kubernetes.io/instance: tetragon
    spec:
      containers:
        - name: tetragon
          image: quay.io/cilium/tetragon:v1.7.1
status:
  desiredNumberScheduled: 2
  numberReady: 1
