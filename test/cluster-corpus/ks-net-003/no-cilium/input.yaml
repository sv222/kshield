apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai
  uid: 4a050000-0041-4000-8000-000000000041
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "facebook/opt-125m"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-config
  namespace: kube-system
  uid: 4a050000-0042-4000-8000-000000000042
data:
  enable-wireguard: "true"
