apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai
  uid: 4a050000-0021-4000-8000-000000000021
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "facebook/opt-125m"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cilium
  namespace: kube-system
  uid: 4a050000-0022-4000-8000-000000000022
  labels:
    k8s-app: cilium
    app.kubernetes.io/part-of: cilium
    app.kubernetes.io/name: cilium-agent
spec:
  selector:
    matchLabels:
      k8s-app: cilium
  template:
    metadata:
      labels:
        k8s-app: cilium
        app.kubernetes.io/name: cilium-agent
        app.kubernetes.io/part-of: cilium
    spec:
      containers:
        - name: cilium-agent
          image: quay.io/cilium/cilium:v1.20.3
status:
  desiredNumberScheduled: 3
  numberReady: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-config
  namespace: kube-system
  uid: 4a050000-0023-4000-8000-000000000023
data:
  cluster-name: default
  enable-ipv4: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-config
  namespace: other
  uid: 4a050000-0024-4000-8000-000000000024
data:
  enable-wireguard: "true"
