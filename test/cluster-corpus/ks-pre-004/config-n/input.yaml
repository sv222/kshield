apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai
  uid: 4a040000-0001-4000-8000-000000000001
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "facebook/opt-125m"]
