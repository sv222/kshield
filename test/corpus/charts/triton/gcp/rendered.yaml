apiVersion: v1
kind: Service
metadata:
  name: triton-triton-inference-server
  namespace: ai-inference
  labels:
    app: triton-inference-server
    chart: triton-inference-server-1.0.0
    release: triton
    heritage: Helm
spec:
  type: LoadBalancer
  ports:
    - port: 8000
      targetPort: http
      name: http-inference-server
    - port: 8001
      targetPort: grpc
      name: grpc-inference-server
    - port: 8002
      targetPort: metrics
      name: metrics-inference-server
  selector:
    app: triton-inference-server
    release: triton
---
# Source: triton-inference-server/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: triton-triton-inference-server-metrics
  namespace: ai-inference
  labels:
    app: triton-inference-server-metrics
    chart: triton-inference-server-1.0.0
    release: triton
    heritage: Helm
  annotations:
    alpha.monitoring.coreos.com/non-namespaced: "true"
spec:
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
  selector:
    app: triton-inference-server
    release: triton
