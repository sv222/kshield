apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-triton-inference-server
  namespace: ai-inference
  labels:
    app: triton-inference-server
    chart: triton-inference-server-1.0.0
    release: triton
    heritage: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton-inference-server
      release: triton
  template:
    metadata:
      labels:
        app: triton-inference-server
        release: triton

    spec:
      containers:
        - name: triton-inference-server
          image: "nvcr.io/nvidia/tritonserver:26.09-py3"
          imagePullPolicy: IfNotPresent

          resources:
            limits:
              nvidia.com/gpu: 1

          args: ["tritonserver", "--model-store=gs://triton-inference-server-repository/model_repository"]

          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: grpc
            - containerPort: 8002
              name: metrics
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            httpGet:
              path: /v2/health/ready
              port: http

      securityContext:
        runAsUser: 1000
        fsGroup: 1000
---
# Source: triton-inference-server/templates/service.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: triton-triton-inference-server-metrics-monitor
  namespace: ai-inference
  labels:
    app: triton-inference-server-metrics-monitor
    chart: triton-inference-server-1.0.0
    release: triton
    heritage: Helm
spec:
  selector:
    matchLabels:
      app: triton-inference-server-metrics
  endpoints:
  - port: metrics
    interval: 15s
