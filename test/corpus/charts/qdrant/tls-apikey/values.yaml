# The apikey variant plus TLS on the Qdrant API. The certificate comes from
# Secret "qdrant-tls" (created outside the chart, so not in the render),
# mounted at /qdrant/tls; tls.cert and tls.key are relative to /qdrant.
apiKey: "corpus-placeholder-api-key"
config:
  service:
    enable_tls: true
  tls:
    cert: "./tls/tls.crt"
    key: "./tls/tls.key"
additionalVolumes:
  - name: "qdrant-tls"
    secret:
      secretName: "qdrant-tls"
additionalVolumeMounts:
  - name: "qdrant-tls"
    mountPath: "/qdrant/tls"
    readOnly: true
