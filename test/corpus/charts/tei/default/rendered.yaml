apiVersion: v1
kind: Pod
metadata:
  name: "tei-text-embeddings-inference-test-connection"
  labels:
    helm.sh/chart: text-embeddings-inference-0.3.0
    app.kubernetes.io/name: text-embeddings-inference
    app.kubernetes.io/instance: tei
    app.kubernetes.io/version: "1.9.3"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['tei-text-embeddings-inference:80']
  restartPolicy: Never
