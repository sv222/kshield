---
# Source: local-ai/templates/pvcs.yaml
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: local-ai-models
  labels:
    app.kubernetes.io/instance: local-ai
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: local-ai
    app.kubernetes.io/version: "2.23"
    helm.sh/chart: local-ai-3.4.2
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: "10Gi"
---
# Source: local-ai/templates/pvcs.yaml
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: local-ai-output
  labels:
    app.kubernetes.io/instance: local-ai
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: local-ai
    app.kubernetes.io/version: "2.23"
    helm.sh/chart: local-ai-3.4.2
