apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      initContainers:
        - name: fetch-model
          image: busybox:1.36
          command: ["sh", "-c", "echo fetch"]
          resources:
            limits:
              memory: 256Mi
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "facebook/opt-125m"]
          resources:
            requests:
              memory: 16Gi
            limits:
              memory: 32Gi
