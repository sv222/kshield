apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-inference
  annotations:
    kshield.io/gateway-auth: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.5.0
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-inference
spec:
  type: LoadBalancer
  selector:
    app: ollama
  ports:
    - port: 443
      targetPort: 11434
