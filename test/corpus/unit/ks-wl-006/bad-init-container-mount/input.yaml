apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      initContainers:
        - name: warmup
          image: busybox:1.36
          command: ["sh", "-c", "echo warmup"]
          volumeMounts:
            - name: shm
              mountPath: /dev/shm/
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "facebook/opt-125m"]
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
