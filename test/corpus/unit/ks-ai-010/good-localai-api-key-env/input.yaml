apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai
  namespace: ai-inference

spec:
  replicas: 1
  selector:
    matchLabels:
      app: localai
  template:
    metadata:
      labels:
        app: localai
    spec:
      containers:
        - name: localai
          image: quay.io/go-skynet/local-ai:latest
          env:
            - name: LOCALAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: localai
                  key: key
