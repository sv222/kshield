apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: ai-inference

spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton
  template:
    metadata:
      labels:
        app: triton
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.05-py3
          args: ["--model-repository=/models"]
