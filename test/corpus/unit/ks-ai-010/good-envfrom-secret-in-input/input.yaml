apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei
  namespace: ai-inference

spec:
  replicas: 1
  selector:
    matchLabels:
      app: tei
  template:
    metadata:
      labels:
        app: tei
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
          args: ["--model-id", "BAAI/bge-small-en-v1.5"]
          envFrom:
            - secretRef:
                name: tei-key
---
apiVersion: v1
kind: Secret
metadata:
  name: tei-key
  namespace: ai-inference
stringData:
  API_KEY: change-me
