apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: ai-inference
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.2
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
