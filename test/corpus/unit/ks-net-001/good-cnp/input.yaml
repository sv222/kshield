apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "meta-llama/Llama-3.1-8B-Instruct", "--load-format", "safetensors"]
          ports:
            - containerPort: 8000
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vllm-egress
  namespace: ai-inference
spec:
  endpointSelector:
    matchLabels:
      k8s:app: vllm
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
