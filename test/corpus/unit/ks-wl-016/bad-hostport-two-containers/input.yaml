apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "facebook/opt-125m"]
          ports:
            - containerPort: 8000
            - containerPort: 9090
              hostPort: 9090
        - name: metrics
          image: registry.example.com/platform/exporter:1.0
          ports:
            - containerPort: 9100
              hostPort: 9100
