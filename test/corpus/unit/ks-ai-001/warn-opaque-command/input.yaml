apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          command: ["/opt/app/start-server.sh"]
          args: ["--model", "meta-llama/Llama-3.1-8B-Instruct", "--trust-remote-code"]
