apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: registry.example.com/serving/runtime:1.0
          command: ["/bin/sh", "-c"]
          args: ["exec vllm serve meta-llama/Llama-3.1-8B-Instruct --load-format safetensors"]
