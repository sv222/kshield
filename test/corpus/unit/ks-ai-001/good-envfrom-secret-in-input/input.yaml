apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "meta-llama/Llama-3.1-8B-Instruct", "--load-format", "safetensors"]
          envFrom:
            - configMapRef:
                name: vllm-settings
            - prefix: VLLM_
              secretRef:
                name: vllm-keys
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-settings
  namespace: ai-inference
data:
  VLLM_LOGGING_LEVEL: INFO
---
apiVersion: v1
kind: Secret
metadata:
  name: vllm-keys
  namespace: ai-inference
type: Opaque
stringData:
  API_KEY: not-a-real-key
