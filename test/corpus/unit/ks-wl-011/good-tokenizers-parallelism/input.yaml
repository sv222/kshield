apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "facebook/opt-125m"]
          env:
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: MAX_NUM_BATCHED_TOKENS
              value: "8192"
