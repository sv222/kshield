apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      containers:
        - name: llm
          image: registry.internal/my-llm:v2
          volumeMounts:
            - name: data
              mountPath: /data/.ollama
      volumes:
        - name: data
          emptyDir: {}
