apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          securityContext:
            runAsUser: 0
