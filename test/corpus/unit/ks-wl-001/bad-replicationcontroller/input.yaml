apiVersion: v1
kind: ReplicationController
metadata:
  name: vllm
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args: ["--model", "facebook/opt-125m"]
