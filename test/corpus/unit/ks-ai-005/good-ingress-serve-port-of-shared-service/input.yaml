apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster
  namespace: ai-inference
spec:
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.9.0
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
              - containerPort: 8000
                name: serve
---
apiVersion: v1
kind: Service
metadata:
  name: ray-head
  namespace: ai-inference
spec:
  type: ClusterIP
  selector:
    ray.io/cluster: raycluster
    ray.io/node-type: head
  ports:
    - name: serve
      port: 8000
      targetPort: serve
    - name: dashboard
      port: 8265
      targetPort: dashboard
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ray-serve
  namespace: ai-inference
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ray-head
                port:
                  name: serve
