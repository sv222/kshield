apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster
  namespace: ai-inference
spec:
  headGroupSpec:
    serviceType: ClusterIP
    enableIngress: false
    rayStartParams: {}
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.9.0
            ports:
              - containerPort: 8265
                name: dashboard
              - containerPort: 8000
                name: serve
---
apiVersion: v1
kind: Service
metadata:
  name: ray-dashboard
  namespace: ai-inference
spec:
  type: ClusterIP
  selector:
    ray.io/cluster: raycluster
    ray.io/node-type: head
  ports:
    - port: 8265
---
apiVersion: v1
kind: Service
metadata:
  name: ray-serve
  namespace: ai-inference
spec:
  type: LoadBalancer
  selector:
    ray.io/cluster: raycluster
    ray.io/node-type: head
  ports:
    - port: 80
      targetPort: serve
