apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.5.0
          env:
            - name: OLLAMA_ORIGINS
              value: "https://chat.example.com"
            - name: OLLAMA_DEBUG
              value: "false"
